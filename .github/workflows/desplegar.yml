# Publica el Worker en Cloudflare con el dominio propio (pausa.family), conecta el bot de Telegram
# y deja la dirección anterior (guardian-familiar.<cuenta>.workers.dev) redirigiendo al dominio.
# Necesita estos secretos: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, KV_ID, BOT_TOKEN,
# BOT_USERNAME, TELEGRAM_SECRET, ANTHROPIC_API_KEY y METRICAS_CLAVE. Opcionales: ANTHROPIC_WORKSPACE_ID
# (si la clave de Anthropic no pertenece a un workspace) y WORKER_URL: si falta, se usa la
# dirección de src/web/config.ts (el dominio).
name: Desplegar

on:
  workflow_dispatch:

permissions:
  contents: read

# Con «shell: bash» explícito, GitHub usa pipefail: «comando | tee» falla si falla el comando.
defaults:
  run:
    shell: bash

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # La web se arma al final: las pruebas generan su propia versión de public/ (sin estos datos)
      # y la que se publica tiene que ser esta.
      - run: npm run build:web
        env:
          # El usuario del bot, para los enlaces a Telegram de la web.
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          # Responsable y email de contacto para la página de privacidad (variables o secretos del
          # repositorio: se publican en la página, así que no son secretos de verdad).
          SITIO_RESPONSABLE: ${{ vars.SITIO_RESPONSABLE || secrets.SITIO_RESPONSABLE }}
          SITIO_CONTACTO: ${{ vars.SITIO_CONTACTO || secrets.SITIO_CONTACTO }}
          # Número de Pausa en WhatsApp para la web. Se carga recién cuando el canal está probado, y
          # aunque esté cargado, la web no lo muestra si faltan los secretos del canal.
          SITIO_WHATSAPP: ${{ secrets.WHATSAPP_TOKEN != '' && secrets.WHATSAPP_PHONE_ID != '' && (vars.SITIO_WHATSAPP || secrets.SITIO_WHATSAPP) || '' }}
          SITIO_WHATSAPP_IT: ${{ secrets.WHATSAPP_TOKEN != '' && secrets.WHATSAPP_PHONE_ID_IT != '' && (vars.SITIO_WHATSAPP_IT || secrets.SITIO_WHATSAPP_IT) || '' }}
      - name: Completar la configuración
        env:
          KV_ID: ${{ secrets.KV_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
        run: |
          test -n "$KV_ID" && test -n "$BOT_USERNAME"
          # Si KV_ID trae el nombre del espacio en lugar de su ID, se busca el ID por el nombre.
          if ! [[ "$KV_ID" =~ ^[0-9a-f]{32}$ ]]; then
            KV_ID=$(npx wrangler kv namespace list | node scripts/id-kv.mjs "$KV_ID")
          fi
          sed -i "s/KV_ID_PENDIENTE/${KV_ID}/; s/BOT_USERNAME_PENDIENTE/${BOT_USERNAME#@}/" wrangler.toml
      - name: Publicar el Worker
        id: publicar
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          npx wrangler deploy | tee /tmp/deploy.log
          url="${WORKER_URL:-$(npx tsx -e "import { siteConfig } from './src/web/config'; console.log(siteConfig().url)")}"
          workers=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          test -n "$url" && test -n "$workers"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "workers=${workers%/}" >> "$GITHUB_OUTPUT"
      - name: Cargar los secretos del Worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_SECRET: ${{ secrets.TELEGRAM_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          METRICAS_CLAVE: ${{ secrets.METRICAS_CLAVE }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          WHATSAPP_PHONE_ID_IT: ${{ secrets.WHATSAPP_PHONE_ID_IT }}
          WHATSAPP_NUMBER_IT: ${{ secrets.WHATSAPP_NUMBER_IT }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_TEMPLATE_ALERTA: ${{ secrets.WHATSAPP_TEMPLATE_ALERTA }}
        run: |
          node -e '
            const keys = ["BOT_TOKEN", "TELEGRAM_SECRET", "ANTHROPIC_API_KEY", "ANTHROPIC_WORKSPACE_ID", "METRICAS_CLAVE",
              "WHATSAPP_TOKEN", "WHATSAPP_PHONE_ID", "WHATSAPP_NUMBER", "WHATSAPP_PHONE_ID_IT", "WHATSAPP_NUMBER_IT",
              "WHATSAPP_APP_SECRET", "WHATSAPP_VERIFY_TOKEN", "WHATSAPP_TEMPLATE_ALERTA"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("fs").writeFileSync("/tmp/secretos.json", JSON.stringify(out));
          '
          npx wrangler secret bulk /tmp/secretos.json
          rm /tmp/secretos.json
      - name: Control de vida
        env:
          WORKER_URL: ${{ steps.publicar.outputs.url }}
        # Con un dominio recién comprado, el DNS y el certificado pueden tardar varios minutos.
        run: curl -fsS --max-time 20 --retry 60 --retry-delay 20 --retry-all-errors "$WORKER_URL/salud"
      - name: Conectar el bot de Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_SECRET: ${{ secrets.TELEGRAM_SECRET }}
          WORKER_URL: ${{ steps.publicar.outputs.url }}
        run: npx tsx scripts/configurar-webhook.ts
      - name: La dirección *.workers.dev lleva al dominio
        env:
          WORKER_URL: ${{ steps.publicar.outputs.url }}
          WORKERS: ${{ steps.publicar.outputs.workers }}
        run: |
          destino=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$WORKERS/es/")
          echo "$WORKERS/es/ → $destino"
          [ "$WORKERS" = "$WORKER_URL" ] || [ "$destino" = "301 ${WORKER_URL}/es/" ]
      - name: Redirigir la dirección anterior
        env:
          WORKER_URL: ${{ steps.publicar.outputs.url }}
        run: |
          npx wrangler deploy --config redireccion/wrangler.toml --var "DESTINO:${WORKER_URL}" | tee /tmp/redireccion.log
          vieja=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/redireccion.log | head -1)
          test -n "$vieja"
          for i in 1 2 3 4 5 6; do
            destino=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$vieja/es/" || true)
            echo "$vieja/es/ → $destino"
            [ "$destino" = "301 ${WORKER_URL}/es/" ] && exit 0
            sleep 5
          done
          exit 1
