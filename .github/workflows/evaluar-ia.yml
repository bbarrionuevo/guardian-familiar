# Evaluación completa con la IA. Cuesta plata (unas 220 consultas por corrida), por eso es manual.
name: Evaluar con IA

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: Modelo de Claude
        default: claude-haiku-5-5
        type: choice
        options: [claude-haiku-5-5, claude-opus-5-5, claude-sonnet-5-5]

permissions:
  contents: read

# Con «shell: bash» explícito, GitHub usa pipefail: «comando | tee» falla si falla el comando.
defaults:
  run:
    shell: bash

jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      GUARDIAN_MODELO: ${{ inputs.modelo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Falta la clave
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "Cargá el secreto ANTHROPIC_API_KEY en Settings → Secrets and variables → Actions."
          exit 1
      - name: Banco visible
        run: npx tsx scripts/evaluar.ts | tee informe-visible.txt
      - name: Banco ciego (solo totales)
        run: npx tsx scripts/evaluar.ts --ciego | tee informe-ciego.txt
      - name: Resumen
        run: |
          {
            echo "## Evaluación con ${GUARDIAN_MODELO}"
            echo '```'
            cat informe-visible.txt
            echo
            cat informe-ciego.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
