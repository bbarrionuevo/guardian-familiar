# Configuración del Worker. El id del espacio KV se reemplaza en el despliegue (secreto KV_ID).
name = "guardian-familiar"
main = "src/servidor/worker.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Páginas, estilos e íconos generados por scripts/generar-web.ts. El Worker atiende primero
# solo sus rutas; el resto lo sirven los assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/telegram/*", "/whatsapp/*", "/salud", "/es/compartir", "/it/compartir"]

[[kv_namespaces]]
binding = "GUARDIAN_KV"
id = "KV_ID_PENDIENTE"

[ai]
binding = "AI"

[vars]
BOT_USERNAME = "BOT_USERNAME_PENDIENTE"
GUARDIAN_MODELO = "claude-haiku-5-5"

[observability]
enabled = true
