# Configuración del Worker. El id del espacio KV se reemplaza en el despliegue (secreto KV_ID).
name = "pausa"
main = "src/servidor/worker.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Dominio propio, comprado en Cloudflare en la misma cuenta: al publicar se crean el DNS y el
# certificado. www y la dirección *.workers.dev redirigen al dominio (src/servidor/worker.ts).
workers_dev = true
routes = [
  { pattern = "pausa.family", custom_domain = true },
  { pattern = "www.pausa.family", custom_domain = true },
]

# Páginas, estilos e íconos generados por scripts/generar-web.ts. El Worker atiende todo primero
# (para mandar www y *.workers.dev al dominio) y le pasa a los assets lo que no es suyo.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[kv_namespaces]]
binding = "GUARDIAN_KV"
id = "KV_ID_PENDIENTE"

[ai]
binding = "AI"

# Contadores (límites diarios y métricas) en un Durable Object con SQLite, que entra en el plan
# gratis: 100.000 escrituras por día, contra 1000 de KV. La clase está en src/servidor/contadores.ts.
[[durable_objects.bindings]]
name = "CONTADORES"
class_name = "Contadores"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Contadores"]

[vars]
BOT_USERNAME = "BOT_USERNAME_PENDIENTE"
GUARDIAN_MODELO = "claude-haiku-5-5"

[observability]
enabled = true
